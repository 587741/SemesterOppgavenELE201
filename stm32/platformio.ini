[env:nucleo_f767zi]
platform = ststm32
board = nucleo_f767zi
framework = stm32cube

build_flags =
    -IInc
    -IMiddlewares/Third_Party/LwIP/src/include
    -IMiddlewares/Third_Party/LwIP/system
    -IDrivers/BSP/Components/lan8742
    -Wl,-u,_printf_float

extra_scripts =
    pre:extra_script.py

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200